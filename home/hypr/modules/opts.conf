#############################
### CONFIGURATION OPTIONS ###
#############################

# https://wiki.hyprland.org/Configuring/Variables/

general {
    border_size = 1

    gaps_in = 4
    gaps_out = 8

    col.inactive_border = $base04
    col.active_border = $base08 $base09 45deg

    layout = dwindle

    resize_on_border = false

    # https://wiki.hyprland.org/Configuring/Tearing/
    allow_tearing = false
}

decoration {
    rounding = 8

    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 8
        passes = 2

        vibrancy = 0.1696
    }

    shadow {
        enabled = true
        range = 12
        render_power = 2
        color = rgba(00000066)
        offset = 0, 2
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # https://wiki.hyprland.org/Configuring/Animations/

    bezier = macOS, 0.16, 1.0, 0.3, 1.0

    animation = windows, 1, 3, macOS, slide
    animation = windowsOut, 1, 2, default, popin 80%
    animation = border, 1, 5, default
    animation = borderangle, 1, 5, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, macOS, slidevert
}

# Layer rules for blur on UI elements
layerrule = blur true; namespace:waybar
layerrule = ignore_alpha 0.3; namespace:waybar
layerrule = blur true; namespace:gtk-layer-shell
layerrule = blur true; namespace:wofi
layerrule = ignore_alpha 0.3; namespace:wofi

# https://wiki.hyprland.org/Configuring/Dwindle-Layout/
dwindle {
    pseudotile = false # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below

    force_split = 2

    preserve_split = true
}

# https://wiki.hyprland.org/Configuring/Master-Layout/
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc { 
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}
